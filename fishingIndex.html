<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Fishing Adventure - Kenali Deria</title>


<!-- =====================================================
     CSS
===================================================== -->

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;
}

body {
    background: #76d5ee;
}


/* =====================================================
   GAME SCREEN
===================================================== */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #75d8f3 0%,
            #c9f2f5 48%,
            #159dbb 48%,
            #08779b 100%
        );
}


/* =====================================================
   SKY
===================================================== */

.cloud {

    position: absolute;

    z-index: 2;

    font-size: 45px;

    opacity: .4;

    animation:
        cloudMove
        25s
        ease-in-out
        infinite;
}

.cloud.one {

    left: 8%;
    top: 8%;
}

.cloud.two {

    left: 73%;
    top: 15%;

    font-size: 38px;

    animation-duration: 35s;
}

@keyframes cloudMove {

    0%,
    100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(30px);
    }
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    position: absolute;

    left: 20px;
    top: 7%;

    z-index: 900;

    border: none;

    padding:
        11px 20px;

    border-radius: 12px;

    background:
        rgba(37, 74, 97, .95);

    color: #9ceafa;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   SOUND
===================================================== */

.sound-button {

    position: absolute;

    right: 20px;
    top: 7%;

    z-index: 900;

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 12px;

    background:
        rgba(37, 74, 97, .95);

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   QUESTION AREA
===================================================== */

.question-area {

    position: absolute;

    top: 8%;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(840px, 58%);

    z-index: 700;
}


/* =====================================================
   QUESTION
===================================================== */

.question {

    min-height: 62px;

    padding:
        15px 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    border-radius: 20px;

    background:
        rgba(44, 62, 82, .97);

    border:
        2px solid
        rgba(31, 92, 122, .6);

    color: white;

    font-size:
        clamp(
            16px,
            1.8vw,
            23px
        );

    font-weight: bold;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.13);
}


/* =====================================================
   ANSWERS
===================================================== */

.answers {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;

    margin-top: 8px;
}

.answer {

    min-height: 52px;

    padding:
        7px 10px;

    display: flex;

    align-items: center;

    gap: 9px;

    border-radius: 15px;

    background:
        rgba(53, 70, 89, .97);

    color: white;

    font-size:
        clamp(
            12px,
            1.3vw,
            18px
        );

    font-weight: bold;
}

.answer-letter {

    width: 32px;
    height: 32px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #18384a;

    font-weight: 900;
}


/* =====================================================
   ANSWER COLOURS
===================================================== */

.answer:nth-child(1)
.answer-letter {

    background: #ff6d86;
}

.answer:nth-child(2)
.answer-letter {

    background: #20c9e8;
}

.answer:nth-child(3)
.answer-letter {

    background: #ffc62d;
}

.answer:nth-child(4)
.answer-letter {

    background: #9b79f3;
}


/* =====================================================
   STATS
===================================================== */

.stats {

    position: absolute;

    top: 30%;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 700;
}

.stat {

    padding:
        7px 17px;

    border-radius: 22px;

    background:
        rgba(38, 82, 107, .9);

    color: white;

    font-size: 14px;

    font-weight: bold;

    white-space: nowrap;
}


/* =====================================================
   WATER
===================================================== */

.water {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 53%;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #149dbb 0%,
            #0b88a9 45%,
            #076c91 100%
        );

    z-index: 10;
}


/* =====================================================
   WATER SURFACE
===================================================== */

.surface {

    position: absolute;

    left: -5%;
    top: -6px;

    width: 110%;
    height: 20px;

    z-index: 100;

    background:
        repeating-radial-gradient(
            ellipse at center,
            rgba(255,255,255,.55)
            0px,
            rgba(255,255,255,.55)
            2px,
            transparent
            3px,
            transparent
            28px
        );

    animation:
        surfaceMove
        5s
        ease-in-out
        infinite;
}

@keyframes surfaceMove {

    0%,
    100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(-25px);
    }
}


/* =====================================================
   LIGHT RAYS
===================================================== */

.ray {

    position: absolute;

    top: 0;

    width: 50px;
    height: 100%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.13),
            rgba(255,255,255,0)
        );

    transform:
        skewX(-14deg);

    animation:
        rayMove
        7s
        ease-in-out
        infinite;
}

.ray.r1 {
    left: 9%;
}

.ray.r2 {
    left: 31%;
    animation-delay: 1.5s;
}

.ray.r3 {
    left: 56%;
    animation-delay: 3s;
}

.ray.r4 {
    left: 82%;
    animation-delay: 4s;
}

@keyframes rayMove {

    0%,
    100% {
        opacity: .25;
    }

    50% {
        opacity: .75;
    }
}


/* =====================================================
   BUBBLES
===================================================== */

.bubble {

    position: absolute;

    width: 7px;
    height: 7px;

    border:
        2px solid
        rgba(255,255,255,.3);

    border-radius: 50%;

    animation:
        bubbleUp
        5s
        linear
        infinite;
}

@keyframes bubbleUp {

    0% {

        transform:
            translateY(60px);

        opacity: 0;
    }

    20% {
        opacity: .7;
    }

    100% {

        transform:
            translateY(-350px);

        opacity: 0;
    }
}


/* =====================================================
   BOAT
   SENTIASA KEKAL DI ATAS AIR
===================================================== */

.boat {

    position: absolute;

    left: 50%;

    top: -7px;

    width: 155px;
    height: 115px;

    transform:
        translateX(-50%);

    z-index: 300;

    animation:
        boatFloat
        3s
        ease-in-out
        infinite;
}

@keyframes boatFloat {

    0%,
    100% {

        transform:
            translateX(-50%)
            translateY(0);
    }

    50% {

        transform:
            translateX(-50%)
            translateY(-4px);
    }
}


/* =====================================================
   BOAT SEAT
===================================================== */

.boat-seat {

    position: absolute;

    left: 23px;
    bottom: 37px;

    width: 109px;
    height: 15px;

    background:
        #ffd86c;

    border-radius: 6px;

    z-index: 4;
}


/* =====================================================
   BOAT BODY
===================================================== */

.boat-body {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 155px;
    height: 43px;

    background:
        linear-gradient(
            to bottom,
            #ff844c,
            #e94c27
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            84% 100%,
            16% 100%
        );

    border-radius:
        0 0 30px 30px;

    z-index: 3;
}


/* =====================================================
   NELAYAN
   SENTIASA ADA
===================================================== */

.fisherman {

    position: absolute;

    left: 58px;
    bottom: 45px;

    width: 42px;
    height: 62px;

    z-index: 15;

    transform:
        scale(.78);

    transform-origin:
        bottom center;

    pointer-events: none;
}


/* =====================================================
   NELAYAN HEAD
===================================================== */

.fisher-head {

    position: absolute;

    left: 13px;
    top: 1px;

    width: 25px;
    height: 27px;

    background:
        #ffc79a;

    border-radius: 50%;

    z-index: 3;
}


/* =====================================================
   HAT
===================================================== */

.fisher-hat {

    position: absolute;

    left: 5px;
    top: -5px;

    width: 38px;
    height: 12px;

    background:
        #ffb51f;

    border-radius:
        50% 50% 20% 20%;

    z-index: 5;
}

.fisher-hat::after {

    content: "";

    position: absolute;

    left: -4px;
    top: 8px;

    width: 46px;
    height: 5px;

    background:
        #df7119;

    border-radius: 50%;
}


/* =====================================================
   NELAYAN BODY
===================================================== */

.fisher-body {

    position: absolute;

    left: 9px;
    top: 25px;

    width: 34px;
    height: 38px;

    background:
        #3f73dc;

    border-radius:
        14px 14px 5px 5px;
}


/* =====================================================
   NELAYAN ARM
===================================================== */

.fisher-arm {

    position: absolute;

    left: 30px;
    top: 31px;

    width: 28px;
    height: 7px;

    background:
        #ffc79a;

    border-radius: 20px;

    transform:
        rotate(15deg);

    transform-origin:
        left center;

    z-index: 8;
}


/* =====================================================
   JORAN
   JORAN TIDAK BERGERAK
===================================================== */

.rod {

    position: absolute;

    left: 91px;
    top: 35px;

    width: 185px;
    height: 4px;

    background:
        linear-gradient(
            to right,
            #70401e,
            #3d200e
        );

    border-radius: 10px;

    /*
       Joran kekal pada sudut ini.
       TIDAK ADA animation.
       TIDAK ADA transform JS.
    */

    transform:
        rotate(-63deg);

    transform-origin:
        left center;

    z-index: 25;
}


/* =====================================================
   FISHING LINE
   INI SAHAJA YANG BERGERAK
===================================================== */

.fishing-line {

    position: fixed;

    left: 0;
    top: 0;

    width: 2px;
    height: 0;

    background:
        rgba(255,255,255,.95);

    transform-origin:
        0 0;

    z-index: 500;

    pointer-events: none;

    box-shadow:
        0 0 3px
        rgba(0,0,0,.25);

    /*
       Tali mempunyai transition.
       Joran tidak bergerak.
    */

    transition:
        height .55s
        cubic-bezier(.2,.8,.2,1),
        transform .55s
        cubic-bezier(.2,.8,.2,1);
}


/* =====================================================
   HOOK
===================================================== */

.hook {

    position: fixed;

    width: 18px;
    height: 23px;

    z-index: 510;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,-4px);

    transition:
        left .55s
        cubic-bezier(.2,.8,.2,1),
        top .55s
        cubic-bezier(.2,.8,.2,1);
}

.hook::before {

    content: "";

    position: absolute;

    left: 8px;
    top: 0;

    width: 3px;
    height: 15px;

    background:
        #f2f7f8;

    border-radius: 5px;
}

.hook::after {

    content: "";

    position: absolute;

    left: 5px;
    top: 10px;

    width: 10px;
    height: 10px;

    border:
        3px solid
        #f2f7f8;

    border-top: none;

    border-radius:
        0 0 10px 10px;
}


/* =====================================================
   FISH
===================================================== */

.fish {

    position: absolute;

    width: 100px;
    height: 58px;

    z-index: 200;

    cursor: pointer;

    user-select: none;

    touch-action: manipulation;
}


/* =====================================================
   FISH BODY
===================================================== */

.fish-body {

    position: absolute;

    left: 16px;
    top: 8px;

    width: 68px;
    height: 42px;

    border-radius:
        55% 50% 50% 55%;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        inset -7px -7px
        rgba(0,0,0,.12),

        0 5px 12px
        rgba(0,0,0,.18);
}


/* =====================================================
   FISH TAIL
===================================================== */

.fish-tail {

    position: absolute;

    left: -14px;
    top: 7px;

    width: 32px;
    height: 43px;

    clip-path:
        polygon(
            100% 50%,
            0 0,
            17% 50%,
            0 100%
        );
}


/* =====================================================
   FISH EYE
===================================================== */

.fish-eye {

    position: absolute;

    right: 8px;
    top: 8px;

    width: 9px;
    height: 9px;

    background: white;

    border-radius: 50%;
}

.fish-eye::after {

    content: "";

    position: absolute;

    left: 3px;
    top: 3px;

    width: 4px;
    height: 4px;

    background: #111;

    border-radius: 50%;
}


/* =====================================================
   FISH LETTER
===================================================== */

.fish-letter {

    position: absolute;

    left: 38px;
    top: 15px;

    width: 27px;
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(25,25,25,.82);

    color: white;

    font-size: 16px;

    font-weight: 900;

    z-index: 20;
}


/* =====================================================
   FISH COLOURS
===================================================== */

.fish.a .fish-body,
.fish.a .fish-tail {
    background: #ff6885;
}

.fish.b .fish-body,
.fish.b .fish-tail {
    background: #24c8e6;
}

.fish.c .fish-body,
.fish.c .fish-tail {
    background: #ffb51f;
}

.fish.d .fish-body,
.fish.d .fish-tail {
    background: #956df1;
}


/* =====================================================
   FISH SWIMMING
===================================================== */

.fish.swimming {

    animation:
        fishBob
        1.5s
        ease-in-out
        infinite;
}

@keyframes fishBob {

    0%,
    100% {
        margin-top: 0;
    }

    50% {
        margin-top: -5px;
    }
}


/* =====================================================
   FISH CAUGHT
===================================================== */

.fish.caught {

    animation:
        caughtFish
        .2s
        ease-in-out
        infinite
        alternate;
}

@keyframes caughtFish {

    from {
        rotate: -7deg;
    }

    to {
        rotate: 7deg;
    }
}


/* =====================================================
   RIPPLE
===================================================== */

.ripple {

    position: fixed;

    width: 45px;
    height: 15px;

    border:
        3px solid
        rgba(255,255,255,.6);

    border-radius: 50%;

    transform:
        translate(-50%,-50%);

    pointer-events: none;

    animation:
        ripple
        .8s
        ease-out
        forwards;

    z-index: 180;
}

@keyframes ripple {

    from {

        transform:
            translate(-50%,-50%)
            scale(.5);

        opacity: 1;
    }

    to {

        transform:
            translate(-50%,-50%)
            scale(2.5);

        opacity: 0;
    }
}


/* =====================================================
   INSTRUCTION
===================================================== */

.instruction {

    position: absolute;

    left: 50%;
    bottom: 10%;

    transform:
        translateX(-50%);

    z-index: 700;

    padding:
        10px 24px;

    border-radius: 25px;

    background:
        rgba(12,80,110,.75);

    color:
        #8ce7f8;

    font-size: 15px;

    font-weight: bold;

    white-space: nowrap;
}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    z-index: 1200;

    width:
        min(390px,85%);

    padding: 25px;

    border-radius: 25px;

    background: white;

    color: #24465a;

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transition: .3s;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.feedback.show {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.feedback-icon {

    font-size: 50px;
}

.feedback-title {

    margin: 8px 0;

    font-size: 28px;

    font-weight: 900;
}


/* =====================================================
   FINISH SCREEN
===================================================== */

.finish {

    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            #70d5f2,
            #1385aa
        );
}

.finish.show {

    display: flex;
}

.finish-card {

    width:
        min(520px,90%);

    padding: 40px;

    border-radius: 30px;

    background: white;

    color: #24465a;

    text-align: center;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.finish-card h1 {

    margin-bottom: 15px;

    color: #1885a8;

    font-size: 40px;
}

.final-score {

    display: inline-block;

    margin: 20px;

    padding:
        12px 25px;

    border-radius: 30px;

    background: #fff0a3;

    font-size: 23px;

    font-weight: bold;
}

.play-again {

    border: none;

    padding:
        14px 25px;

    border-radius: 15px;

    background: #ff7657;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .question-area {
        width: 76%;
    }

    .answers {
        grid-template-columns:
            repeat(2,1fr);
    }

    .stats {
        top: 35%;
    }
}


@media (max-width: 600px) {

    .back-button {

        top: 4%;
        left: 10px;

        padding:
            8px 12px;

        font-size: 12px;
    }

    .sound-button {

        top: 4%;
        right: 10px;

        width: 38px;
        height: 38px;

        font-size: 17px;
    }

    .question-area {

        top: 8%;

        width: 92%;
    }

    .question {

        min-height: 48px;

        padding:
            9px 12px;

        font-size: 14px;
    }

    .answers {

        gap: 5px;

        margin-top: 5px;
    }

    .answer {

        min-height: 40px;

        padding:
            5px 7px;

        font-size: 11px;

        gap: 5px;
    }

    .answer-letter {

        width: 25px;
        height: 25px;
    }

    .stats {

        top: 32%;

        gap: 4px;
    }

    .stat {

        padding:
            5px 9px;

        font-size: 10px;
    }

    .boat {

        transform:
            translateX(-50%)
            scale(.78);
    }

    .instruction {

        bottom: 4%;

        padding:
            8px 14px;

        font-size: 11px;
    }
}


/* =====================================================
   IPAD LANDSCAPE
===================================================== */

@media
(min-width: 900px)
and (max-height: 700px) {

    .question-area {

        top: 6%;

        width: 57%;
    }

    .stats {

        top: 28%;
    }

    .instruction {

        bottom: 6%;
    }
}

</style>


</head>


<body>


<!-- =====================================================
     HTML
===================================================== -->

<div id="game">


    <div class="cloud one">
        ☁️
    </div>

    <div class="cloud two">
        ☁️
    </div>


    <!-- BACK -->

    <button
        class="back-button"
        onclick="goBack()">

        ← Back

    </button>


    <!-- SOUND -->

    <button
        class="sound-button"
        id="soundButton"
        onclick="toggleSound()">

        🔊

    </button>


    <!-- =================================================
         QUESTION
    ================================================== -->

    <div class="question-area">

        <div
            class="question"
            id="questionText">
        </div>


        <div
            class="answers"
            id="answerDisplay">
        </div>

    </div>


    <!-- =================================================
         SCORE
    ================================================== -->

    <div class="stats">

        <div class="stat">

            🎣

            <span id="score">
                0
            </span>

            pts

        </div>


        <div class="stat">

            🪝

            <span id="questionCount">
                1 / 25
            </span>

        </div>


        <div class="stat">

            Sunlit Reef

        </div>

    </div>


    <!-- =================================================
         WATER
    ================================================== -->

    <div
        class="water"
        id="water">


        <div class="surface"></div>


        <div class="ray r1"></div>

        <div class="ray r2"></div>

        <div class="ray r3"></div>

        <div class="ray r4"></div>


        <!-- =================================================
             BOT
             NELAYAN SENTIASA ADA
        ================================================== -->

        <div
            class="boat"
            id="boat">


            <!-- NELAYAN -->

            <div
                class="fisherman">


                <div
                    class="fisher-hat">
                </div>


                <div
                    class="fisher-head">
                </div>


                <div
                    class="fisher-body">
                </div>


                <div
                    class="fisher-arm">
                </div>


            </div>


            <!-- TEMPAT DUDUK -->

            <div
                class="boat-seat">
            </div>


            <!-- BADAN BOT -->

            <div
                class="boat-body">
            </div>


            <!-- JORAN -->

            <div
                class="rod"
                id="rod">
            </div>


        </div>


        <!-- =================================================
             TALIAN JORAN
             HANYA INI YANG BERGERAK
        ================================================== -->

        <div

/* =====================================================

let currentQuestion = 0;

let score = 0;

===================================================== */

function loadQuestion() {

    locked = false;

    removeLine();

    createFish();

    updateQuestionUI();

}


/* =====================================================

function updateQuestionUI() {

    const q =

/* =====================================================
   CREATE FISH
===================================================== */

function createFish() {

    document
        .querySelectorAll(".fish")
        .forEach(
            fish => fish.remove()
        );


    fishAnimationIDs.forEach(
        id =>
            cancelAnimationFrame(id)
    );


    fishAnimationIDs = [];


    const positions = [

        {
            x: 78,
            y: 5
        },

        {
            x: 57,
            y: 28
        },

        {
            x: 72,
            y: 52
        },

        {
            x: 48,
            y: 72
        }

    ];


    questions[
        currentQuestion
    ].answers.forEach(
        (answer,index) => {

            const fish =
                document.createElement(
                    "div"
                );


            fish.className =
                `
                fish
                ${["a","b","c","d"][index]}
                swimming
                `;


            fish.dataset.index =
                index;


            fish.style.left =
                positions[index].x +
                "%";


            fish.style.top =
                positions[index].y +
                "%";


            fish.innerHTML = `

                <div
                    class="fish-tail">
                </div>

                <div
                    class="fish-body">

                    <div
                        class="fish-eye">
                    </div>

                </div>

                <div
                    class="fish-letter">

                    ${
                        String.fromCharCode(
                            65 + index
                        )
                    }

                </div>

            `;


            fish.addEventListener(
                "pointerdown",
                function(event) {

                    event.preventDefault();

                    catchFish(
                        fish,
                        index
                    );

                }
            );


            water.appendChild(
                fish
            );


            swimFish(
                fish,
                index
            );

        }
    );

}


/* =====================================================
   NATURAL FISH SWIMMING
===================================================== */

function swimFish(
    fish,
    index
) {

    let direction =
        index % 2 === 0
            ? 1
            : -1;


    let x =
        parseFloat(
            fish.style.left
        );


    const baseY =
        parseFloat(
            fish.style.top
        );


    let phase =
        Math.random() *
        Math.PI *
        2;


    const speed =
        .012 +
        Math.random() *
        .012;


    function swim() {

        if (
            !fish.isConnected
        ) {

            return;

        }


        if (
            !locked
        ) {

            x +=
                direction *
                speed;


            if (
                x >= 91
            ) {

                direction = -1;

            }


            if (
                x <= 3
            ) {

                direction = 1;

            }


            phase += .025;


            const wave =
                Math.sin(
                    phase
                ) * 2.3;


            fish.style.left =
                x + "%";


            fish.style.top =
                (
                    baseY +
                    wave
                ) + "%";


            if (
                direction > 0
            ) {

                fish.style.transform =
                    "scaleX(1)";

            } else {

                fish.style.transform =
                    "scaleX(-1)";

            }

        }


        const animationID =
            requestAnimationFrame(
                swim
            );


        fishAnimationIDs.push(
            animationID
        );

    }


    swim();

}


/* =====================================================
   FISH SELECTED
===================================================== */

function catchFish(
    fish,
    selectedIndex
) {

    if (locked) {
        return;
    }


    locked = true;


    /*
       IKAN BERHENTI
    */

    fish.classList.remove(
        "swimming"
    );


    fish.classList.add(
        "caught"
    );


    /*
       DAPATKAN TITIK IKAN
    */

    const fishRect =
        fish.getBoundingClientRect();


    const targetX =
        fishRect.left +
        fishRect.width / 2;


    const targetY =
        fishRect.top +
        fishRect.height / 2;


    /*
       BUAT RIPPLE
    */

    createRipple(
        targetX,
        targetY
    );


    /*
       PENTING:
       JORAN LANGSUNG KEKAL.

       HANYA TALI AKAN BERGERAK.
    */

    animateLineToFish(
        targetX,
        targetY
    );


    /*
       Selepas tali sampai,
       tarik ikan.
    */

    setTimeout(
        () => {

            reelFish(
                fish,
                selectedIndex
            );

        },
        650
    );

}


/* =====================================================
   ANIMATE LINE TO FISH
   HANYA TALI BERGERAK
===================================================== */

function animateLineToFish(
    targetX,
    targetY
) {

    /*
       Ambil titik HUJUNG JORAN.
    */

    const rodRect =
        rod.getBoundingClientRect();


    const startX =
        rodRect.left +
        rodRect.width;


    const startY =
        rodRect.top +
        rodRect.height / 2;


    const dx =
        targetX -
        startX;


    const dy =
        targetY -
        startY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    /*
       Tali bermula dari joran.
    */

    fishingLine.style.left =
        startX + "px";


    fishingLine.style.top =
        startY + "px";


    fishingLine.style.height =
        "0px";


    fishingLine.style.transform =
        `rotate(${angle}deg)`;


    hook.style.left =
        startX + "px";


    hook.style.top =
        startY + "px";


    hook.style.opacity =
        "1";


    /*
       Browser perlu satu frame
       sebelum tali bergerak.
    */

    requestAnimationFrame(
        () => {

            fishingLine.style.height =
                distance + "px";


            hook.style.left =
                targetX + "px";


            hook.style.top =
                targetY + "px";

        }
    );

}


/* =====================================================
   REEL FISH
===================================================== */

function reelFish(
    fish,
    selectedIndex
) {

    const fishRect =
        fish.getBoundingClientRect();


    const startX =
        fishRect.left;


    const startY =
        fishRect.top;


    const boatRect =
        boat.getBoundingClientRect();


    const targetX =
        boatRect.left +
        55;


    const targetY =
        boatRect.top +
        45;


    fish.style.position =
        "fixed";


    fish.style.left =
        startX + "px";


    fish.style.top =
        startY + "px";


    animateFishToBoat(
        fish,
        startX,
        startY,
        targetX,
        targetY,
        selectedIndex
    );

}


/* =====================================================
   FISH PULLING
===================================================== */

function animateFishToBoat(
    fish,
    startX,
    startY,
    targetX,
    targetY,
    selectedIndex
) {

    const startTime =
        performance.now();


    const duration =
        850;


    function animate(
        now
    ) {

        const progress =
            Math.min(
                (
                    now -
                    startTime
                ) /
                duration,
                1
            );


        const ease =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        const x =
            startX +
            (
                targetX -
                startX
            ) *
            ease;


        const y =
            startY +
            (
                targetY -
                startY
            ) *
            ease;


        const wiggle =
            Math.sin(
                progress *
                Math.PI *
                10
            ) *
            (
                10 *
                (1 - progress)
            );


        fish.style.left =
            x + "px";


        fish.style.top =
            (
                y +
                wiggle
            ) + "px";


        fish.style.transform =
            `
            rotate(
                ${
                    Math.sin(
                        progress *
                        Math.PI *
                        10
                    ) * 8
                }deg
            )
            `;


        /*
           TALI MENGIKUT IKAN.
        */

        updateLineToMovingFish(
            fish
        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        } else {

            fish.remove();

            finishCatch(
                selectedIndex
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   LINE FOLLOW FISH
===================================================== */

function updateLineToMovingFish(
    fish
) {

    const rodRect =
        rod.getBoundingClientRect();


    const fishRect =
        fish.getBoundingClientRect();


    const startX =
        rodRect.left +
        rodRect.width;


    const startY =
        rodRect.top +
        rodRect.height / 2;


    const targetX =
        fishRect.left +
        fishRect.width / 2;


    const targetY =
        fishRect.top +
        fishRect.height / 2;


    const dx =
        targetX -
        startX;


    const dy =
        targetY -
        startY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    /*
       HANYA LINE BERUBAH.
    */

    fishingLine.style.left =
        startX + "px";


    fishingLine.style.top =
        startY + "px";


    fishingLine.style.height =
        distance + "px";


    fishingLine.style.transform =
        `rotate(${angle}deg)`;


    hook.style.left =
        targetX + "px";


    hook.style.top =
        targetY + "px";

}


/* =====================================================
   FINISH CATCH
===================================================== */

function finishCatch(
    selectedIndex
) {

    const correct =
        questions[
            currentQuestion
        ].correct;


    removeLine();


    if (
        selectedIndex ===
        correct
    ) {

        score += 10;


        showFeedback(
            "🎉",
            "HEBAT!",
            "Jawapan betul! +10 mata"
        );


        setTimeout(
            () => {

                hideFeedback();

                currentQuestion++;


                if (
                    currentQuestion >=
                    questions.length
                ) {

                    finishGame();

                } else {

                    loadQuestion();

                }

            },
            1100
        );


    } else {

        showFeedback(
            "😅",
            "CUBA LAGI!",
            "Ikan itu bukan jawapan yang betul."
        );


        setTimeout(
            () => {

                hideFeedback();

                loadQuestion();

            },
            1200
        );

    }

}


/* =====================================================
   RIPPLE
===================================================== */

function createRipple(
    x,
    y
) {

    const ripple =
        document.createElement(
            "div"
        );


    ripple.className =
        "ripple";


    ripple.style.left =
        x + "px";


    ripple.style.top =
        y + "px";


    document.body.appendChild(
        ripple
    );


    setTimeout(
        () => {

            ripple.remove();

        },
        800
    );

}


/* =====================================================
   REMOVE LINE
===================================================== */

function removeLine() {

    fishingLine.style.height =
        "0px";


    hook.style.opacity =
        "0";

}


/* =====================================================
   BUBBLES
===================================================== */

function createBubbles() {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        const size =
            4 +
            Math.random() * 8;


        bubble.style.width =
            size + "px";


        bubble.style.height =
            size + "px";


        bubble.style.left =
            Math.random() *
            100 +
            "%";


        bubble.style.top =
            55 +
            Math.random() *
            40 +
            "%";


        bubble.style.animationDelay =
            Math.random() *
            5 +
            "s";


        water.appendChild(
            bubble
        );

    }

}

===================================================== */

    document

            "feedback"

            "show"
        );

}


function hideFeedback() {

    document
        .getElementById(
            "feedback"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================

===================================================== */

        .getElementById(
            "finish"

===================================================== */

function restartGame() {

    currentQuestion = 0;

    score = 0;

    locked = false;


    document
        .getElementById(
            "finish"
        )
        .classList.remove(
            "show"
        );


    loadQuestion();

}

    soundOn =

    if (
        document.referrer

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}
