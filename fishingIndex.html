<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Fishing - Kenali Deria</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           WEBSITE BACKGROUND
        ===================================================== */

        body {

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(255,255,255,.25),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    rgba(255,255,255,.18),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #071f36 0%,
                    #0b4963 35%,
                    #087f8f 70%,
                    #063b5b 100%
                );

            display: flex;

            justify-content: center;

            align-items: center;

            overflow-x: hidden;

            min-height: 100vh;

            padding: 10px;
        }


        /* =====================================================
           GAME WRAPPER
        ===================================================== */

        .game-wrapper {

            width: min(100%, 900px);

            padding: 18px;
        }


        /* =====================================================
           GAME
        ===================================================== */

        .game {

            position: relative;

            width: 100%;

            height: min(760px, 88vh);

            min-height: 620px;

            overflow: hidden;

            border-radius: 28px;

            border: 7px solid white;

            background:

                linear-gradient(
                    to bottom,
                    #8ddcff 0%,
                    #dff8ff 52%,
                    #0c91b2 52.5%,
                    #087b9d 100%
                );

            box-shadow:

                0 15px 40px
                rgba(0, 0, 0, 0.35),

                0 0 60px
                rgba(42, 205, 232, .18);
        }


        /* =====================================================
           SKY
        ===================================================== */

        .sky {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 53%;

            z-index: 1;

            pointer-events: none;
        }


        /* SUN */

        .sun {

            position: absolute;

            width: 65px;
            height: 65px;

            right: 8%;
            top: 8%;

            border-radius: 50%;

            background: #ffd338;

            box-shadow:

                0 0 25px
                rgba(255, 211, 56, 0.55),

                0 0 50px
                rgba(255, 211, 56, 0.25);
        }


        /* CLOUDS */

        .cloud {

            position: absolute;

            width: 130px;
            height: 38px;

            background:
                rgba(255,255,255,0.85);

            border-radius: 50px;
        }


        .cloud::before,
        .cloud::after {

            content: "";

            position: absolute;

            background:
                rgba(255,255,255,0.85);

            border-radius: 50%;
        }


        .cloud::before {

            width: 58px;
            height: 58px;

            left: 20px;
            top: -28px;
        }


        .cloud::after {

            width: 48px;
            height: 48px;

            left: 65px;
            top: -20px;
        }


        .cloud.one {

            left: 7%;
            top: 18%;
        }


        .cloud.two {

            right: 16%;
            top: 25%;

            transform: scale(.75);
        }


        /* =====================================================
           WATER
        ===================================================== */

        .water {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 47%;

            z-index: 2;

            overflow: hidden;

            background:

                linear-gradient(
                    to bottom,
                    #0c91b2,
                    #087b9d 55%,
                    #075d7d 100%
                );
        }


        /* LIGHT RAYS */

        .light-ray {

            position: absolute;

            top: 0;

            width: 100px;
            height: 100%;

            background:

                linear-gradient(
                    to bottom,
                    rgba(255,255,255,.14),
                    transparent
                );

            transform:
                skewX(-15deg);

            opacity: .45;
        }


        .ray1 {
            left: 15%;
        }


        .ray2 {
            left: 48%;
        }


        .ray3 {
            right: 12%;
        }


        /* BUBBLES */

        .bubble {

            position: absolute;

            width: 10px;
            height: 10px;

            border:
                2px solid
                rgba(255,255,255,.35);

            border-radius: 50%;

            animation:
                bubbleMove
                5s
                ease-in
                infinite;
        }


        .bubble:nth-child(4) {

            left: 12%;
            bottom: 15%;
        }


        .bubble:nth-child(5) {

            left: 35%;
            bottom: 4%;

            animation-delay: 1.5s;
        }


        .bubble:nth-child(6) {

            right: 18%;
            bottom: 20%;

            animation-delay: 2.5s;
        }


        @keyframes bubbleMove {

            0% {

                transform:
                    translateY(20px);

                opacity: 0;
            }

            25% {

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-260px);

                opacity: 0;
            }
        }


        /* =====================================================
           WATER SURFACE
        ===================================================== */

        .surface {

            position: absolute;

            left: 0;
            top: 52%;

            width: 100%;

            height: 8px;

            z-index: 8;

            background:
                rgba(255,255,255,.9);

            box-shadow:
                0 2px 7px
                rgba(0,0,0,.12);

            animation:
                surfaceGlow
                2s
                ease-in-out
                infinite alternate;
        }


        @keyframes surfaceGlow {

            from {
                opacity: .7;
            }

            to {
                opacity: 1;
            }
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            position: absolute;

            left: 18px;
            right: 18px;

            top: 15px;

            z-index: 40;

            text-align: center;
        }


        .top-row {

            position: relative;

            height: 42px;
        }


        /* BACK */

        .back-button {

            position: absolute;

            left: 0;
            top: 0;

            border: none;

            border-radius: 13px;

            background: #31576d;

            color: white;

            padding:
                9px 15px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .12s ease,
                background .12s ease;
        }


        .back-button:active {

            transform: scale(.92);

            background: #203e4e;
        }


        /* SOUND */

        .sound-button {

            position: absolute;

            right: 0;
            top: 0;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 13px;

            background: #31576d;

            color: white;

            font-size: 19px;

            cursor: pointer;

            transition:
                transform .12s ease,
                background .12s ease;
        }


        .sound-button:active {

            transform: scale(.92);
        }


        /* QUESTION NUMBER */

        .question-number {

            display: inline-block;

            margin-top: 5px;

            padding:
                8px 20px;

            border-radius: 25px;

            background: white;

            color: #36576a;

            font-size: 15px;

            font-weight: 900;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,.12);
        }


        /* QUESTION */

        .question-box {

            width: min(760px, 92%);

            margin:
                8px auto 0;

            padding:
                11px 18px;

            border-radius: 16px;

            background: #30495e;

            color: white;

            font-size: 19px;

            line-height: 1.25;

            font-weight: bold;

            box-shadow:
                0 5px 12px
                rgba(0,0,0,.16);
        }


        /* =====================================================
           PILIHAN JAWAPAN
        ===================================================== */

        .answer-options {

            width: min(760px, 92%);

            margin:
                8px auto 0;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;
        }


        .answer-option {

            min-height: 43px;

            display: flex;

            align-items: center;

            padding:
                5px 8px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.96);

            color: #30495e;

            box-shadow:
                0 4px 8px
                rgba(0,0,0,.14);

            text-align: left;

            font-size: 12px;

            font-weight: bold;
        }


        .answer-letter {

            width: 29px;
            height: 29px;

            min-width: 29px;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-right: 7px;

            border-radius: 50%;

            color: white;

            font-size: 13px;

            font-weight: 900;
        }


        .answer-option:nth-child(1)
        .answer-letter {

            background: #ff6680;
        }


        .answer-option:nth-child(2)
        .answer-letter {

            background: #2ccde8;
        }


        .answer-option:nth-child(3)
        .answer-letter {

            background: #ffb629;
        }


        .answer-option:nth-child(4)
        .answer-letter {

            background: #9b6cff;
        }


        .answer-text {

            flex: 1;

            line-height: 1.15;
        }


        /* =====================================================
           SCORE
        ===================================================== */

        .score-row {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 8px;
        }


        .score {

            background: white;

            color: #36576a;

            border-radius: 20px;

            padding:
                6px 13px;

            font-size: 13px;

            font-weight: bold;

            box-shadow:
                0 3px 8px
                rgba(0,0,0,.12);
        }


        /* =====================================================
           ARAHAN
        ===================================================== */

        .instruction {

            position: absolute;

            left: 50%;

            bottom: 18px;

            top: auto;

            transform:
                translateX(-50%);

            z-index: 35;

            background:
                rgba(33,93,116,.92);

            color: white;

            border-radius: 25px;

            padding:
                9px 18px;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;

            box-shadow:
                0 5px 12px
                rgba(0,0,0,.15);

            text-align: center;

            animation:
                instructionPulse
                2s
                ease-in-out
                infinite;
        }


        @keyframes instructionPulse {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    scale(1);
            }

            50% {

                transform:
                    translateX(-50%)
                    scale(1.03);
            }
        }


        /* =====================================================
           FISHING AREA
        ===================================================== */

        .fishing-area {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            z-index: 20;

            pointer-events: none;

            transition:
                transform .1s ease;
        }


        /* =====================================================
           FISH
        ===================================================== */

        .fish {

            position: absolute;

            width: 74px;
            height: 43px;

            cursor: pointer;

            pointer-events: auto;

            transition:
                transform .15s ease,
                filter .15s ease;

            z-index: 15;

            animation:

                swimHorizontal
                var(--speed)
                ease-in-out
                infinite
                alternate,

                fishBob
                1.8s
                ease-in-out
                infinite;
        }


        .fish-body {

            position: absolute;

            width: 57px;
            height: 39px;

            left: 5px;
            top: 2px;

            border-radius:
                55% 45% 45% 55% /
                60% 55% 45% 40%;

            background:
                var(--fish-color);

            box-shadow:

                inset -7px -5px
                0 rgba(0,0,0,.08),

                0 4px 10px
                rgba(0,0,0,.15);
        }


        .fish-tail {

            position: absolute;

            right: 0;
            top: 4px;

            width: 0;
            height: 0;

            border-top:
                18px solid transparent;

            border-bottom:
                18px solid transparent;

            border-right:
                27px solid
                var(--fish-color);

            transform:
                rotate(180deg);
        }


        .fish-eye {

            position: absolute;

            width: 13px;
            height: 13px;

            background: white;

            border-radius: 50%;

            left: 14px;
            top: 10px;

            z-index: 2;
        }


        .fish-eye::after {

            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            background: #111;

            border-radius: 50%;

            left: 4px;
            top: 4px;
        }


        .fish-label {

            position: absolute;

            left: 26px;
            top: 9px;

            width: 31px;
            height: 25px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.95);

            color: #30495e;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 13px;

            font-weight: 900;

            z-index: 5;
        }


        .fish:hover {

            transform:
                scale(1.12);

            filter:
                brightness(1.1);
        }


        .fish:active {

            transform:
                scale(.92);
        }


        .fish.caught {

            animation:
                caughtFish
                .6s
                ease
                forwards;
        }


        @keyframes caughtFish {

            0% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.25)
                    rotate(-8deg);
            }

            100% {

                transform:
                    scale(.2);

                opacity: 0;
            }
        }


        @keyframes swimHorizontal {

            from {

                margin-left:
                    -35px;
            }

            to {

                margin-left:
                    35px;
            }
        }


        @keyframes fishBob {

            0%,
            100% {

                margin-top: 0;
            }

            50% {

                margin-top:
                    -9px;
            }
        }


        /* =====================================================
           FISH POSITIONS
        ===================================================== */

        .fish-a {

            left: 8%;
            top: 67%;

            --fish-color: #ff6680;
            --speed: 2.7s;
        }


        .fish-b {

            left: 48%;
            top: 75%;

            --fish-color: #2ccde8;
            --speed: 3.2s;
        }


        .fish-c {

            right: 8%;
            top: 64%;

            --fish-color: #ffb629;
            --speed: 2.5s;
        }


        .fish-d {

            left: 62%;
            top: 87%;

            --fish-color: #9b6cff;
            --speed: 3.5s;
        }


        /* =====================================================
           FISHERMAN + BOAT
        ===================================================== */

        .fisherman-group {

            position: absolute;

            left: 50%;
            top: 43%;

            width: 150px;
            height: 115px;

            transform:
                translateX(-50%);

            z-index: 18;

            pointer-events: none;
        }


        .fisher-head {

            position: absolute;

            width: 27px;
            height: 27px;

            left: 57px;
            top: 0;

            border-radius: 50%;

            background: #ffd0a6;

            z-index: 5;
        }


        .fisher-hat {

            position: absolute;

            width: 37px;
            height: 10px;

            left: 52px;
            top: -4px;

            border-radius: 50%;

            background: #ffd338;

            z-index: 7;
        }


        .fisher-body {

            position: absolute;

            width: 31px;
            height: 47px;

            left: 55px;
            top: 24px;

            border-radius:
                12px 12px 7px 7px;

            background: #f05b68;

            z-index: 4;
        }


        .fisher-arm {

            position: absolute;

            width: 10px;
            height: 36px;

            left: 78px;
            top: 30px;

            border-radius: 8px;

            background: #ffd0a6;

            transform:
                rotate(-25deg);

            transform-origin:
                top center;

            z-index: 8;
        }


        .fisher-leg.one,
        .fisher-leg.two {

            position: absolute;

            width: 8px;
            height: 25px;

            top: 65px;

            background: #3b4451;

            border-radius: 5px;

            z-index: 3;
        }


        .fisher-leg.one {

            left: 59px;
        }


        .fisher-leg.two {

            left: 73px;
        }


        /* =====================================================
           BOAT
        ===================================================== */

        .boat {

            position: absolute;

            left: 23px;
            top: 76px;

            width: 105px;
            height: 28px;

            background:

                linear-gradient(
                    to bottom,
                    #ffbd32 0 20%,
                    #f27624 20% 100%
                );

            border-radius:
                5px 5px 38px 38px;

            border-bottom:
                4px solid #d9501b;

            z-index: 2;
        }


        /* =====================================================
           FISHING ROD
        ===================================================== */

        .rod {

            position: absolute;

            width: 9px;
            height: 70px;

            left: 77px;
            top: 27px;

            background:

                linear-gradient(
                    to right,
                    #75471f,
                    #a96732
                );

            border-radius: 8px;

            transform:
                rotate(25deg);

            transform-origin:
                bottom center;

            z-index: 10;
        }


        .rod-tip {

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #4c2d17;

            left: 100%;
            top: 0;

            transform:
                translate(-50%, -50%);
        }


        /* =====================================================
           FISHING LINE
        ===================================================== */

        #fishingLine {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            overflow: visible;

            z-index: 19;

            pointer-events: none;
        }


        #linePath {

            fill: none;

            stroke:
                rgba(255,255,255,.95);

            stroke-width: 2.5;

            stroke-linecap: round;

            filter:
                drop-shadow(
                    0 1px 2px
                    rgba(0,0,0,.5)
                );

            transition:
                d .65s
                cubic-bezier(.2,.8,.2,1);
        }


        /* =====================================================
           HOOK
        ===================================================== */

        #hookGroup {

            position: absolute;

            width: 24px;
            height: 35px;

            left: 0;
            top: 0;

            z-index: 21;

            pointer-events: none;

            transform:
                translate(-50%, -5%);
        }


        .hook-line {

            position: absolute;

            left: 11px;
            top: -20px;

            width: 2px;
            height: 24px;

            background: white;
        }


        .hook {

            position: absolute;

            left: 4px;
            top: 4px;

            width: 17px;
            height: 21px;

            border:
                3px solid white;

            border-top: none;

            border-radius:
                0 0 15px 15px;

            transform:
                rotate(-12deg);
        }


        .hook::after {

            content: "";

            position: absolute;

            right: -4px;
            bottom: 1px;

            width: 8px;
            height: 3px;

            background: white;

            border-radius: 4px;

            transform:
                rotate(-35deg);
        }


        /* =====================================================
           RESULT MESSAGE
        ===================================================== */

        .result-message {

            position: absolute;

            left: 50%;

            top: 64%;

            transform:
                translate(-50%, -50%);

            z-index: 60;

            padding:
                12px 22px;

            border-radius: 25px;

            color: white;

            font-size: 14px;

            font-weight: bold;

            opacity: 0;

            pointer-events: none;

            white-space: nowrap;

            transition:
                opacity .2s ease;
        }


        .result-message.show {

            opacity: 1;

            animation:
                resultPop
                .3s
                ease;
        }


        @keyframes resultPop {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(.7);
            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }


        .result-message.correct {

            background:
                rgba(23,157,88,.95);

            box-shadow:
                0 8px 20px
                rgba(23,157,88,.3);
        }


        .result-message.wrong {

            background:
                rgba(210,62,62,.95);

            box-shadow:
                0 8px 20px
                rgba(210,62,62,.3);
        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        .game-over {

            position: absolute;

            inset: 0;

            z-index: 100;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                rgba(10,48,65,.82);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .3s ease;
        }


        .game-over.show {

            opacity: 1;

            pointer-events: auto;
        }


        .game-over-box {

            width: min(420px, 85%);

            padding: 30px;

            text-align: center;

            background: white;

            border-radius: 25px;

            color: #30495e;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.3);

            animation:
                gameOverPop
                .45s
                ease;
        }


        @keyframes gameOverPop {

            0% {

                transform:
                    scale(.7);

                opacity: 0;
            }

            100% {

                transform:
                    scale(1);

                opacity: 1;
            }
        }


        .game-over-box h2 {

            font-size: 28px;

            margin-bottom: 12px;
        }


        .game-over-box p {

            margin-bottom: 15px;
        }


        .final-score {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        /* =====================================================
           GAME OVER BUTTONS
        ===================================================== */

        .game-over-buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .restart-button,
        .home-button {

            border: none;

            color: white;

            padding:
                12px 20px;

            border-radius: 14px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .12s ease,
                filter .12s ease;
        }


        .restart-button {

            background: #ff6680;
        }


        .home-button {

            background: #31576d;
        }


        .restart-button:hover,
        .home-button:hover {

            filter: brightness(1.08);
        }


        .restart-button:active,
        .home-button:active {

            transform:
                scale(.92);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {

                padding: 5px;
            }


            .game-wrapper {

                width: 100%;

                padding: 7px;
            }


            .game {

                height: 720px;

                min-height: 620px;

                border-width: 5px;

                border-radius: 22px;
            }


            .header {

                left: 10px;
                right: 10px;

                top: 10px;
            }


            .question-number {

                font-size: 13px;

                padding:
                    7px 16px;
            }


            .question-box {

                font-size: 15px;

                padding:
                    9px 12px;
            }


            .answer-options {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 6px;

                margin-top: 7px;
            }


            .answer-option {

                min-height: 39px;

                padding:
                    4px 6px;

                font-size: 11px;
            }


            .answer-letter {

                width: 25px;
                height: 25px;

                min-width: 25px;

                font-size: 11px;

                margin-right: 5px;
            }

/* ============================================================
   GAME VARIABLES
============================================================ */

let currentQuestion = 0;

let soundOn = true;

/* ============================================================
   AUDIO SYSTEM
============================================================ */

let audioContext = null;

let masterGain = null;

let musicTimer = null;

let musicStarted = false;


/* ============================================================
   INITIALIZE AUDIO
============================================================ */

function initAudio() {

    if (audioContext)
        return;


    const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioCtx)
        return;


    audioContext =
        new AudioCtx();


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        soundOn ? 0.8 : 0;


    masterGain.connect(
        audioContext.destination
    );

}


/* ============================================================
   RESUME AUDIO
============================================================ */

async function resumeAudio() {

    initAudio();


    if (!audioContext)
        return;


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();

    }


    if (
        soundOn &&
        !musicStarted
    ) {

        startBackgroundMusic();

    }

}


/* ============================================================
   GENERATE TONE
============================================================ */

function createTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.08,
    delay = 0
) {

    if (
        !audioContext ||
        !masterGain ||
        !soundOn
    )
        return;


    const now =
        audioContext.currentTime +
        delay;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        0,
        now
    );


    gain.gain.linearRampToValueAtTime(
        volume,
        now + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
    );


    oscillator.connect(gain);

    gain.connect(masterGain);


    oscillator.start(now);

    oscillator.stop(
        now + duration + 0.03
    );

}

/* ============================================================
   BACKGROUND MUSIC
============================================================ */

function startBackgroundMusic() {

    if (
        musicStarted ||
        !audioContext ||
        !soundOn
    )
        return;


    musicStarted = true;


    const melody = [

        261.63,
        329.63,
        392.00,
        329.63,

        293.66,
        349.23,
        440.00,
        349.23,

        261.63,
        329.63,
        392.00,
        440.00,

        392.00,
        329.63,
        293.66,
        261.63

    ];


    let index = 0;


    function playNextNote() {

        if (
            !soundOn ||
            !audioContext
        )
            return;


        const note =
            melody[index];


        createTone(
            note,
            0.72,
            "sine",
            0.018
        );


        createTone(
            note / 2,
            0.72,
            "triangle",
            0.008
        );


        index++;

        if (
            index >=
            melody.length
        ) {

            index = 0;

        }

    }


    playNextNote();


    musicTimer =
        setInterval(
            playNextNote,
            700
        );

}

    if (musicTimer) {

        clearInterval(

function getRodTip() {

        );


    const gameRect =
        game.getBoundingClientRect();


    const rect =
        rodTip.getBoundingClientRect();


    return {

        x:
            rect.left +
            rect.width / 2 -
            gameRect.left,

        y:
            rect.top +
            rect.height / 2 -
            gameRect.top

    };

}

            gameRect.left,

        y:

            rect.height / 2 -
            gameRect.top

    };

}

   DRAW LINE
============================================================ */

function drawLineTo(
    x,
    y

    const gameRect =
        game.getBoundingClientRect();


    const rod =
        getRodTip();


    const startX =
        rod.x /
        gameRect.width *
        1000;


    const startY =
        rod.y /
        gameRect.height *
        700;


    const endX =
        x /
        gameRect.width *
        1000;


    const endY =
        y /
        gameRect.height *
        700;


    const middleX =
        (startX + endX) / 2;


    const middleY =
        (startY + endY) / 2;


    linePath.setAttribute(

        "d",

        `M ${startX} ${startY}
         Q ${middleX - 20}
           ${middleY}
           ${endX}
           ${endY}`

    );


    hookGroup.style.left =
        x + "px";


    hookGroup.style.top =
        y + "px";

}

                "translateX(-5px)";


            setTimeout(() => {

                fishingArea.style.transform =
                    "translateX(5px)";

            }, 80);


            setTimeout(() => {

                fishingArea.style.transform =
                    "translateX(0)";

            }, 160);


            setTimeout(() => {


                resultMessage.className =
                    "result-message";


                resetLine();


                busy = false;


            }, 900);

        }


    }, 650);

}


/* ============================================================
   RESET LINE
============================================================ */

function resetLine() {


    const rod =
        getRodTip();


    const gameRect =
        game.getBoundingClientRect();


    const x =
        rod.x /
        gameRect.width *
        1000;


    const y =
        rod.y /
        gameRect.height *
        700;


    linePath.setAttribute(

        "d",

        `M ${x} ${y}
         ${x} ${y}`

    );


    hookGroup.style.left =
        rod.x + "px";


    hookGroup.style.top =
        rod.y + "px";


    busy = false;

}


/* ============================================================
   LOAD QUESTION
============================================================ */

function loadQuestion() {


    const data =
        questions[
            currentQuestion
        ];


    questionNumber.textContent =

        `SOALAN ${
            currentQuestion + 1
        } / ${
            questions.length
        }`;


    questionText.textContent =
        data.q;


    answerA.textContent =
        data.A;


    answerB.textContent =
        data.B;


    answerC.textContent =
        data.C;


    answerD.textContent =
        data.D;


    document
        .querySelectorAll(
            ".fish"
        )
        .forEach(
            fish => {

                fish.classList.remove(
                    "caught"
                );


                fish.style.display =
                    "block";

            }
        );


    resetLine();

}


/* ============================================================
   GAME OVER
============================================================ */

function endGame() {


    document
        .getElementById(
            "finalScore"
        )
        .textContent =
            score;


    document
        .getElementById(
            "gameOver"
        )
        .classList.add(
            "show"
        );


    stopBackgroundMusic();


    playVictorySound();

}


/* ============================================================
   RESTART
============================================================ */

function restartGame() {


    playButtonSound();


    currentQuestion = 0;

    score = 0;

    caught = 0;


    scoreElement.textContent =
        "0";


    caughtElement.textContent =
        "0";


    document
        .getElementById(
            "gameOver"
        )
        .classList.remove(
            "show"
        );


    loadQuestion();


    if (soundOn) {

        stopBackgroundMusic();

        setTimeout(() => {

            startBackgroundMusic();

        }, 250);

    }

}


/* ============================================================
   HOME
   PERGI KE game1Index.html
============================================================ */

function goHome() {

    playButtonSound();


    stopBackgroundMusic();


    setTimeout(() => {

        window.location.href =
            "game1Index.html";

    }, 120);

}


/* ============================================================
   SOUND TOGGLE
============================================================ */

function toggleSound() {


    soundOn =
        !soundOn;


    const soundButton =
        document.getElementById(
            "soundButton"
        );


    soundButton.textContent =

        soundOn
            ? "🔊"
            : "🔇";


    if (soundOn) {


        initAudio();


        if (audioContext) {

            audioContext.resume();

        }


        if (masterGain) {

            masterGain.gain.cancelScheduledValues(
                audioContext.currentTime
            );


            masterGain.gain.setTargetAtTime(
                0.8,
                audioContext.currentTime,
                0.05
            );

        }


        stopBackgroundMusic();


        startBackgroundMusic();


        playButtonSound();

    }


    else {


        if (
            masterGain &&
            audioContext
        ) {

            masterGain.gain.cancelScheduledValues(
                audioContext.currentTime
            );


            masterGain.gain.setTargetAtTime(
                0,
                audioContext.currentTime,
                0.05
            );

        }


        stopBackgroundMusic();

    }

}


/* ============================================================
   BACK
============================================================ */

function goBack() {


    playButtonSound();


    setTimeout(() => {

        window.history.back();

    }, 120);

}


/* ============================================================
   FIRST USER INTERACTION
============================================================ */

function startAudioAfterInteraction() {

    if (!soundOn)
        return;


    resumeAudio();

}


document.addEventListener(
    "pointerdown",
    startAudioAfterInteraction,
    {
        once: true
    }
);


/* ============================================================
   SOUND UNTUK BUTTON
============================================================ */

document
    .querySelectorAll(
        "button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "pointerdown",
                () => {

                    if (
                        button.id !==
                        "soundButton"
                    ) {

                        playButtonSound();

                    }

                }
            );

        }
    );


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(

    "resize",

    () => {

        if (!busy) {

            resetLine();

        }

    }

);


/* ============================================================
   START GAME
============================================================ */

loadQuestion();


/*
   Jangan cuba autoplay audio
   sebelum user interaction.

   Selepas user sentuh game,
   background music akan bermula.
*/


</script>

</body>
