<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Science Lab Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>
    <div class="background-shape shape-3"></div>

    <!-- HEADER -->
    <header class="hero">

        <div class="lab-icon">🧪</div>

        <div class="hero-text">
            <p class="small-title">SELAMAT DATANG KE</p>

            <h1>
                SCIENCE LAB
                <span>ADVENTURE</span>
            </h1>

            <p class="subtitle">
                🔬 Jom terokai dunia Sains Tahun 1! 🔬
            </p>
        </div>

        <div class="scientist">👩‍🔬</div>

    </header>


    <!-- INSTRUCTION -->
    <section class="instruction">

        <div class="instruction-icon">💡</div>

        <div>
            <h2>Pilih Unit Sains</h2>
            <p>
                Klik pada folder untuk membuka permainan
                bagi unit tersebut!
            </p>
        </div>

    </section>


    <!-- UNIT SECTION -->
    <main class="unit-container">

        <!-- UNIT 1 -->
        <button class="folder-card unit-1" onclick="openUnit(1)">
            <div class="folder-tab">UNIT 1</div>

            <div class="folder">
                <div class="folder-icon">🔬</div>

                <h3>Kemahiran<br>Saintifik</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 2 -->
        <button class="folder-card unit-2" onclick="openUnit(2)">
            <div class="folder-tab">UNIT 2</div>

            <div class="folder">
                <div class="folder-icon">🧪</div>

                <h3>Peraturan<br>Bilik Sains</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 3 -->
        <button class="folder-card unit-3" onclick="openUnit(3)">
            <div class="folder-tab">UNIT 3</div>

            <div class="folder">
                <div class="folder-icon">🌱</div>

                <h3>Benda Hidup &<br>Benda Bukan Hidup</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 4 -->
        <button class="folder-card unit-4" onclick="openUnit(4)">
            <div class="folder-tab">UNIT 4</div>

            <div class="folder">
                <div class="folder-icon">👦</div>

                <h3>Manusia</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 5 -->
        <button class="folder-card unit-5" onclick="openUnit(5)">
            <div class="folder-tab">UNIT 5</div>

            <div class="folder">
                <div class="folder-icon">🐘</div>

                <h3>Haiwan</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 6 -->
        <button class="folder-card unit-6" onclick="openUnit(6)">
            <div class="folder-tab">UNIT 6</div>

            <div class="folder">
                <div class="folder-icon">🌻</div>

                <h3>Tumbuhan</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 7 -->
        <button class="folder-card unit-7" onclick="openUnit(7)">
            <div class="folder-tab">UNIT 7</div>

            <div class="folder">
                <div class="folder-icon">🧲</div>

                <h3>Magnet</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 8 -->
        <button class="folder-card unit-8" onclick="openUnit(8)">
            <div class="folder-tab">UNIT 8</div>

            <div class="folder">
                <div class="folder-icon">💧</div>

                <h3>Penyerapan</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 9 -->
        <button class="folder-card unit-9" onclick="openUnit(9)">
            <div class="folder-tab">UNIT 9</div>

            <div class="folder">
                <div class="folder-icon">🌍</div>

                <h3>Bumi</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>


        <!-- UNIT 10 -->
        <button class="folder-card unit-10" onclick="openUnit(10)">
            <div class="folder-tab">UNIT 10</div>

            <div class="folder">
                <div class="folder-icon">🏗️</div>

                <h3>Asas Binaan</h3>

                <span class="open-text">
                    KLIK UNTUK BUKA
                </span>
            </div>
        </button>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-stars">
            ⭐ ✨ 🔬 ✨ ⭐
        </div>

        <p>
            🌟 Belajar Sains sambil bermain! 🌟
        </p>

        <small>
            Science Lab Adventure • Sains Tahun 1
        </small>

    </footer>


    <script src="script.js"></script>

</body>
</html>
